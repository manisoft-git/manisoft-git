<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Metallic M Gradient -->
    <linearGradient id="metallicM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Neon Cyan / Emerald Glowing Dollar Gradient -->
    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Chamfered Corners -->
  <rect x="10" y="10" width="780" height="220" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Subtle Circuit Lattice Background -->
  <path d="M 40 40 L 140 40 L 160 60 L 260 60" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M 540 180 L 640 180 L 660 160 L 760 160" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="260" cy="60" r="2.5" fill="#38bdf8"/>
  <circle cx="540" cy="180" r="2.5" fill="#00ff87"/>

  <!-- EMBLEM ICON (Left Aligned) -->
  <g transform="translate(105, 120)">
    <!-- Outer Diamond / Hex Ring -->
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#090e1a" stroke="url(#borderGrad)" stroke-width="2"/>

    <!-- Left Leg of M -->
    <path d="M -45,45 L -45,-45 L -26,-45 L -10,0 L -18,12 L -32,-22 L -32,45 Z" fill="url(#metallicM)" stroke="#475569" stroke-width="0.8"/>

    <!-- Right Leg of M -->
    <path d="M 45,45 L 45,-45 L 26,-45 L 10,0 L 18,12 L 32,-22 L 32,45 Z" fill="url(#metallicM)" stroke="#475569" stroke-width="0.8"/>

    <!-- Center Glowing Dollar Glyph ($) -->
    <!-- Vertical Spine -->
    <line x1="0" y1="-55" x2="0" y2="55" stroke="url(#neonGlowGrad)" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>

    <!-- S Curve Body -->
    <path d="M 18,-26 C 18,-42 -18,-42 -18,-20 C -18,-2 18,2 18,20 C 18,42 -18,42 -18,26" 
          fill="none" 
          stroke="url(#neonGlowGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          filter="url(#neonGlow)"/>
  </g>

  <!-- LOGO TEXT BRANDING (Right Aligned) -->
  <g transform="translate(230, 0)">
    <!-- Brand Title -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="58" letter-spacing="6">
      <tspan fill="#f8fafc">MANI</tspan>
      <tspan fill="url(#neonGlowGrad)" filter="url(#neonGlow)">$</tspan>
      <tspan fill="#f8fafc">OFT</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="5" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', monospace" font-weight="600" font-size="14" fill="#38bdf8" letter-spacing="8">
      SOVEREIGN SYSTEMS &amp; PLATFORM ARCHITECTURE
    </text>

    <!-- Accent Indicator Bar -->
    <rect x="5" y="168" width="180" height="2" fill="url(#neonGlowGrad)" rx="1"/>
    <rect x="195" y="168" width="12" height="2" fill="#38bdf8" rx="1"/>
    <rect x="215" y="168" width="6" height="2" fill="#00ff87" rx="1"/>
  </g>
</svg>
